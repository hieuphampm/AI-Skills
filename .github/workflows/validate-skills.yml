name: Validate AI Skills Repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Validate skill schemas, structure, links, and security
        run: python scripts/validate_skills.py

      - name: Check for duplicate or overlapping skills
        run: python scripts/detect_duplicates.py

      - name: Verify registry index is up to date
        run: python scripts/generate_index.py --check

      - name: Run repository and skill unit tests
        run: python -m unittest discover -s tests -v
